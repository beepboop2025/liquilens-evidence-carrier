name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  signed-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - name: Verify signed tag, commit, ancestry, and version
        run: |
          signer_file="ops/release/liquilens-evidence-carrier.allowed_signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-tag --raw "$GITHUB_REF_NAME"
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-commit --raw "$release_commit"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$release_commit" origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("tag and project version differ")
          PY
      - name: Test and build release artifacts
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --extra dev
          uv run --locked --extra dev pytest -q
          uv run --locked --extra dev python scripts/check_trade_safety_conformance.py
          uv run --locked --extra dev python scripts/validate_kit.py
          uv sync --project integrations/trade-safety-gateway --locked --extra test
          uv run --project integrations/trade-safety-gateway --locked --extra test \
            pytest -q integrations/trade-safety-gateway/tests
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          SOURCE_DATE_EPOCH="$source_date_epoch" uv build --out-dir dist
          SOURCE_DATE_EPOCH="$source_date_epoch" \
            uv build --project integrations/trade-safety-gateway --out-dir dist
          SOURCE_DATE_EPOCH="$source_date_epoch" \
            uv build --project integrations/openbb --out-dir dist
          test -f dist/openbb_liquilens_evidence-0.2.0.tar.gz
          npm pack ./integrations/typescript --pack-destination dist
          test -f dist/liquilens-trade-safety-0.1.0.tgz
          cp protocol/liquilens-evidence-carrier-v1.schema.json dist/
          cp protocol/liquilens-evidence-carrier-reference-v1.schema.json dist/
          cp protocol/liquilens-fleet-brief-v1.schema.json dist/
          cp protocol/liquilens-trade-safety-request-v1.schema.json dist/
          cp protocol/liquilens-trade-safety-policy-v1.schema.json dist/
          cp protocol/liquilens-broker-preview-reference-v1.schema.json dist/
          cp protocol/liquilens-trade-safety-receipt-v1.schema.json dist/
          cp protocol/verify_hash_tree_v1.mjs dist/
          cp protocol/conformance/trade-safety-v1/corpus.json \
            dist/liquilens-trade-safety-conformance-v1.json
          cp integrations/fdc3/com.liquilens.evidence.schema.json dist/
          cp integrations/fdc3/com.liquilens.trade-safety-receipt.schema.json dist/
          cp integrations/fdc3/trade-safety-intents.json dist/
          cp integrations/openlineage/liquilens-evidence-facet.schema.json dist/
          version="${GITHUB_REF_NAME#v}"
          artifact="dist/liquilens-evidence-carrier-mcp-${version}.mcpb"
          replay="/tmp/liquilens-evidence-carrier-mcp-${version}.mcpb"
          uv run --locked --extra dev python scripts/build_mcpb.py \
            --output "$artifact" \
            --check-registry-metadata
          uv run --locked --extra dev python scripts/build_mcpb.py \
            --output "$replay" \
            --check-registry-metadata
          cmp --silent "$artifact" "$replay"
          tar \
            --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "dist/liquilens-evidence-carrier-${GITHUB_REF_NAME#v}.tar.gz" \
            LICENSE NOTICE README.md CHANGELOG.md server.json mcpb docs protocol integrations examples
          (
            cd dist
            find . -maxdepth 1 -type f ! -name '.*' ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
      - name: Attest runnable, package, and protocol release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/liquilens_evidence-*.tar.gz
            dist/openbb_liquilens_evidence-*.tar.gz
            dist/liquilens_trade_safety_gateway-*.tar.gz
            dist/liquilens-evidence-carrier-*.tar.gz
            dist/*.mcpb
            dist/*.tgz
            dist/*.schema.json
            dist/liquilens-trade-safety-conformance-v1.json
            dist/trade-safety-intents.json
            dist/verify_hash_tree_v1.mjs
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "LiquiLens Evidence Carrier ${GITHUB_REF_NAME#v}" \
            --notes "Apache-2.0 public release of the portable, fail-closed evidence protocol, Python CLI, offline MCP server and integration kit. Release packages carry GitHub build-provenance attestations and no trading, recommendation, credit-rating, or third-party platform authority."

  mcp-registry:
    needs: signed-release
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify released MCPB attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir released
          gh release download "$GITHUB_REF_NAME" \
            --pattern '*.mcpb' \
            --dir released
          gh attestation verify released/*.mcpb \
            --repo "$GITHUB_REPOSITORY"
      - name: Install pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' \
            'mcp-publisher.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Validate Registry metadata
        run: ./mcp-publisher validate server.json
      - name: Authenticate to the official Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to the official MCP Registry
        run: ./mcp-publisher publish server.json
