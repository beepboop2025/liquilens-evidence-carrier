name: Browser verifier Pages

on:
  pull_request:
    paths:
      - browser/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - browser/**
      - protocol/*.schema.json
      - LICENSE
      - NOTICE
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-browser:
    name: browser-verifier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test deterministic verifier
        run: node --test browser/tests/verifier.test.mjs
      - name: Validate static security and accessibility contracts
        run: python3 browser/tests/validate_site.py

  deploy:
    name: deploy-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-browser
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble static artifact
        run: |
          mkdir -p _site/protocol
          cp browser/.nojekyll browser/index.html browser/styles.css _site/
          cp browser/app.mjs browser/examples.mjs browser/verifier.mjs _site/
          cp LICENSE NOTICE _site/
          cp protocol/liquilens-evidence-carrier-v1.schema.json _site/protocol/
          cp protocol/liquilens-evidence-carrier-reference-v1.schema.json _site/protocol/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
