name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --extra dev
      - name: Test
        run: uv run --locked --extra dev pytest -q

  static-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --extra dev
      - name: Validate contracts and code
        run: |
          uv run --locked --extra dev python scripts/validate_kit.py
          uv run --locked --extra dev pre-commit validate-manifest .pre-commit-hooks.yaml
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev mypy
      - name: Validate exact MCP protocol responses
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/mcp-protocol.schema.json \
            https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/2026-07-28/schema/2026-07-28/schema.json
          printf '%s  %s\n' \
            'ef70b61f99b6d2e5e3b46863822eab08dff6a45bedc7a08914e0e5b133f40203' \
            '/tmp/mcp-protocol.schema.json' \
            | sha256sum --check --strict
          MCP_PROTOCOL_SCHEMA=/tmp/mcp-protocol.schema.json \
            uv run --locked --extra dev pytest -q tests/test_mcp_server.py
      - name: Validate deterministic MCPB and Registry metadata
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/mcpb-manifest.schema.json \
            https://raw.githubusercontent.com/modelcontextprotocol/mcpb/v2.1.2/schemas/mcpb-manifest-v0.3.schema.json
          printf '%s  %s\n' \
            '3a0ac9d845711a1b9b17dfa5a52f8b60628239d6a86a9db417206a9efc78592d' \
            '/tmp/mcpb-manifest.schema.json' \
            | sha256sum --check --strict
          uv run --locked --extra dev python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path('/tmp/mcpb-manifest.schema.json').read_text())
          manifest = json.loads(Path('mcpb/manifest.json').read_text())
          jsonschema.Draft7Validator(schema).validate(manifest)
          PY
          version="$(cat VERSION)"
          artifact="dist/liquilens-evidence-carrier-mcp-${version}.mcpb"
          replay="/tmp/liquilens-evidence-carrier-mcp-${version}.mcpb"
          uv run --locked --extra dev python scripts/build_mcpb.py \
            --output "$artifact" \
            --check-registry-metadata
          uv run --locked --extra dev python scripts/build_mcpb.py \
            --output "$replay" \
            --check-registry-metadata
          cmp --silent "$artifact" "$replay"
          curl --fail --location --silent --show-error \
            --output /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' \
            '/tmp/mcp-publisher.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/mcp-publisher.tar.gz \
            --directory /tmp mcp-publisher
          /tmp/mcp-publisher validate server.json
      - name: Build and inspect package
        run: |
          uv build
          uv run --locked --extra dev python -m zipfile --list dist/*.whl

  action-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Issue an independent action fixture
        run: PYTHONPATH=src python -m liquilens_evidence.evidence_cli issue examples/descriptor.json > action-fixture.evidence.json
      - name: Exercise the local composite action
        uses: ./
        with:
          path: action-fixture.evidence.json
          as_of: "2026-08-24T12:00:00Z"
