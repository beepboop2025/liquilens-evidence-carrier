name: Trade Safety Gateway Container

on:
  pull_request:
    paths:
      - ".github/workflows/gateway-container.yml"
      - "integrations/trade-safety-gateway/**"
      - "src/liquilens_evidence/trade_safety.py"
      - "uv.lock"
      - "VERSION"
  push:
    tags:
      - "v[0-9]*"
      - "trade-safety-gateway-v[0-9]*"

permissions:
  contents: read

concurrency:
  group: gateway-container-${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/liquilens-trade-safety-gateway

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Resolve exact source identity
        id: source
        run: |
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "core_version=$(cat VERSION)"
          } >>"$GITHUB_OUTPUT"
      - name: Build native read-only sandbox image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: integrations/trade-safety-gateway/Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: liquilens-trade-safety-gateway:smoke
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
            CREATED=${{ steps.source.outputs.created }}
            CORE_VERSION=${{ steps.source.outputs.core_version }}
      - name: Smoke health and authority without external network
        run: |
          container_id="$(docker run --detach --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL \
            --security-opt no-new-privileges \
            liquilens-trade-safety-gateway:smoke)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=1).read()"; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          docker exec "$container_id" python -c \
            "import json,urllib.request; value=json.load(urllib.request.urlopen('http://127.0.0.1:8080/v1/capabilities')); assert value['state']=='read_only_sandbox'; assert value['receipt_integrity']=='sha256'; assert value['authority']['can_execute'] is False; assert value['authority']['has_order_submission'] is False; assert value['x402_access']['state']=='disabled'; assert value['x402_access']['protected_path'] is None"
          test "$(docker inspect --format '{{index .Config.Labels "io.liquilens.trade-safety.authority"}}' "$container_id")" = \
            "read-only-hash-only-sandbox"
      - name: Build both target architectures
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: integrations/trade-safety-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
            CREATED=${{ steps.source.outputs.created }}
            CORE_VERSION=${{ steps.source.outputs.core_version }}

  publish:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/trade-safety-gateway-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify signed release and resolve versions
        id: release
        env:
          EXPECTED_GATEWAY_CORE_VERSION: "0.19.0"
          EXPECTED_GATEWAY_VERSION: "0.2.0"
        run: |
          signer_file="ops/release/liquilens-evidence-carrier.allowed_signers"
          tag_name="$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_name")" = "tag"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-tag --raw "$tag_name"
          release_tag_object="$(git rev-parse "${tag_name}^{tag}")"
          release_commit="$(git rev-parse "${tag_name}^{commit}")"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-commit --raw "$release_commit"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$release_commit" origin/main
          source_core_version="$(cat VERSION)"
          source_gateway_version="$(python3 -c \
            'import tomllib; print(tomllib.load(open("integrations/trade-safety-gateway/pyproject.toml", "rb"))["project"]["version"])')"
          case "$tag_name" in
            trade-safety-gateway-v*)
              [[ "$tag_name" =~ ^trade-safety-gateway-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
              tag_gateway_version="${BASH_REMATCH[1]}"
              test "$source_gateway_version" = "$tag_gateway_version"
              test "$source_gateway_version" = "$EXPECTED_GATEWAY_VERSION"
              test "$source_core_version" = "$EXPECTED_GATEWAY_CORE_VERSION"
              release_kind="gateway"
              gateway_version="$source_gateway_version"
              core_version="$source_core_version"
              image_tags="$(printf '%s\n' \
                "${IMAGE}:${gateway_version}" \
                "${IMAGE}:sha-${release_commit}" \
                "${IMAGE}:signed-tag-${release_tag_object}")"
              immutable_tags="$(printf '%s\n' \
                "$gateway_version" \
                "sha-${release_commit}" \
                "signed-tag-${release_tag_object}")"
              ;;
            v*)
              [[ "$tag_name" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
              tag_core_version="${BASH_REMATCH[1]}"
              test "$source_core_version" = "$tag_core_version"
              test "$source_gateway_version" = "$EXPECTED_GATEWAY_VERSION"
              release_kind="core"
              gateway_version="$source_gateway_version"
              core_version="$source_core_version"
              image_tags="$(printf '%s\n' \
                "${IMAGE}:core-${core_version}" \
                "${IMAGE}:core-sha-${release_commit}" \
                "${IMAGE}:latest")"
              immutable_tags=""
              ;;
            *)
              exit 1
              ;;
          esac
          {
            echo "revision=$release_commit"
            echo "release_tag=$tag_name"
            echo "release_tag_object=$release_tag_object"
            echo "release_kind=$release_kind"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "core_version=$core_version"
            echo "gateway_version=$gateway_version"
            echo "image_tags<<EOF"
            printf '%s\n' "$image_tags"
            echo "EOF"
            echo "immutable_tags<<EOF"
            printf '%s\n' "$immutable_tags"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - name: Test and build the exact tagged gateway source
        run: |
          python -m pip install uv==0.12.5
          uv sync --project integrations/trade-safety-gateway --locked --extra test
          uv run --project integrations/trade-safety-gateway --locked --extra test \
            pytest -q integrations/trade-safety-gateway/tests
          uv run --project integrations/trade-safety-gateway --locked --extra test \
            ruff check integrations/trade-safety-gateway/src \
              integrations/trade-safety-gateway/tests
          uv build --project integrations/trade-safety-gateway \
            --out-dir "$RUNNER_TEMP/gateway-dist"
          GATEWAY_WHEEL_ROOT="$RUNNER_TEMP/gateway-wheel" \
            integrations/trade-safety-gateway/.venv/bin/python - <<'PY'
          import os
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path(os.environ["RUNNER_TEMP"]) / "gateway-dist"
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1
          assert len(sdists) == 1
          root = Path(os.environ["GATEWAY_WHEEL_ROOT"])
          with zipfile.ZipFile(wheels[0]) as archive:
              archive.extractall(root)
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              for legal_name in ("LICENSE", "NOTICE"):
                  member = next(
                      member
                      for member in archive.getmembers()
                      if member.name.endswith(f"/{legal_name}")
                  )
                  extracted = archive.extractfile(member)
                  assert extracted is not None
                  assert extracted.read() == Path(
                      f"integrations/trade-safety-gateway/{legal_name}"
                  ).read_bytes()
          assert any(name.endswith("/pyproject.toml") for name in names)
          assert any(name.endswith("/README.md") for name in names)
          sys.path.insert(0, str(root))
          from importlib.metadata import PathDistribution

          metadata_root = next(root.glob("*.dist-info"))
          distribution = PathDistribution(metadata_root)
          assert distribution.version == "0.2.0"
          assert distribution.metadata.get_all("License-File") == [
              "LICENSE",
              "NOTICE",
          ]
          for legal_name in ("LICENSE", "NOTICE"):
              assert (metadata_root / "licenses" / legal_name).read_bytes() == Path(
                  f"integrations/trade-safety-gateway/{legal_name}"
              ).read_bytes()
          entry_points = {
              entry.name: entry
              for entry in distribution.entry_points
              if entry.group == "console_scripts"
          }
          assert set(entry_points) == {
              "liquilens-trade-safety-gateway",
              "liquilens-trade-safety-x402-reconcile",
          }
          assert (root / "trade_safety_gateway/asgi.py").is_file()
          for entry in entry_points.values():
              loaded = entry.load()
              assert callable(loaded)
              module = sys.modules[loaded.__module__]
              assert Path(module.__file__).resolve().is_relative_to(root.resolve())
          PY
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reject pre-existing immutable gateway artifact tags
        if: steps.release.outputs.release_kind == 'gateway'
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_TAGS: ${{ steps.release.outputs.immutable_tags }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          owner_type="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.type')"
          case "$owner_type" in
            Organization)
              endpoint="orgs/$owner/packages/container/liquilens-trade-safety-gateway/versions"
              ;;
            User)
              endpoint="users/$owner/packages/container/liquilens-trade-safety-gateway/versions"
              ;;
            *)
              exit 1
              ;;
          esac
          existing_tags="$(mktemp)"
          trap 'rm -f "$existing_tags"' EXIT
          gh api --paginate "$endpoint?per_page=100" \
            --jq '.[].metadata.container.tags[]?' >"$existing_tags"
          while IFS= read -r immutable_tag; do
            test -n "$immutable_tag"
            if grep -Fqx -- "$immutable_tag" "$existing_tags"; then
              echo "::error::immutable gateway tag already exists: $immutable_tag"
              exit 1
            fi
          done <<<"$IMMUTABLE_TAGS"
      - name: Build and publish attested multi-architecture sandbox
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: integrations/trade-safety-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image_tags }}
          build-args: |
            SOURCE_REVISION=${{ steps.release.outputs.revision }}
            CREATED=${{ steps.release.outputs.created }}
            CORE_VERSION=${{ steps.release.outputs.core_version }}
          labels: |
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
            org.opencontainers.image.description=Read-only hash-only Trade Safety sandbox; no broker submission or order authorization.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=LiquiLens Trade Safety Gateway
            org.opencontainers.image.version=${{ steps.release.outputs.gateway_version }}
            io.liquilens.evidence.core.version=${{ steps.release.outputs.core_version }}
            io.liquilens.release.tag=${{ steps.release.outputs.release_tag }}
            io.liquilens.release.tag-object=${{ steps.release.outputs.release_tag_object }}
            io.liquilens.trade-safety.authority=read-only-hash-only-sandbox
          annotations: |
            index:org.opencontainers.image.created=${{ steps.release.outputs.created }}
            index:org.opencontainers.image.description=Read-only hash-only Trade Safety sandbox; no broker submission or order authorization.
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.title=LiquiLens Trade Safety Gateway
            index:org.opencontainers.image.version=${{ steps.release.outputs.gateway_version }}
            index:io.liquilens.evidence.core.version=${{ steps.release.outputs.core_version }}
            index:io.liquilens.release.tag=${{ steps.release.outputs.release_tag }}
            index:io.liquilens.release.tag-object=${{ steps.release.outputs.release_tag_object }}
            index:io.liquilens.trade-safety.authority=read-only-hash-only-sandbox
          provenance: mode=max
          sbom: true
      - name: Attest published gateway index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify index identity and smoke published digest
        env:
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
          EXPECTED_REVISION: ${{ steps.release.outputs.revision }}
          EXPECTED_CORE_VERSION: ${{ steps.release.outputs.core_version }}
          EXPECTED_GATEWAY_VERSION: ${{ steps.release.outputs.gateway_version }}
          EXPECTED_RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          EXPECTED_RELEASE_TAG_OBJECT: ${{ steps.release.outputs.release_tag_object }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE@$EXPECTED_DIGEST" >gateway-index.json
          python3 - <<'PY'
          import json
          import os

          index = json.load(open("gateway-index.json", encoding="utf-8"))
          platforms = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture"))
              for item in index["manifests"]
          }
          assert {("linux", "amd64"), ("linux", "arm64")} <= platforms
          labels = index["annotations"]
          assert labels["org.opencontainers.image.revision"] == os.environ["EXPECTED_REVISION"]
          assert labels["org.opencontainers.image.version"] == os.environ["EXPECTED_GATEWAY_VERSION"]
          assert labels["io.liquilens.evidence.core.version"] == os.environ["EXPECTED_CORE_VERSION"]
          assert labels["io.liquilens.release.tag"] == os.environ["EXPECTED_RELEASE_TAG"]
          assert labels["io.liquilens.release.tag-object"] == os.environ["EXPECTED_RELEASE_TAG_OBJECT"]
          assert labels["io.liquilens.trade-safety.authority"] == "read-only-hash-only-sandbox"
          PY
          docker pull --platform linux/amd64 "$IMAGE@$EXPECTED_DIGEST"
          container_id="$(docker run --detach --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL \
            --security-opt no-new-privileges "$IMAGE@$EXPECTED_DIGEST")"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" python -c \
              "import json,urllib.request; value=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=1)); assert value['version']=='$EXPECTED_GATEWAY_VERSION'; assert value['source_revision']=='$EXPECTED_REVISION'; assert value['can_execute'] is False"; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          docker exec "$container_id" python -c \
            "import json,urllib.request; value=json.load(urllib.request.urlopen('http://127.0.0.1:8080/v1/capabilities')); assert value['x402_access']['state']=='disabled'; assert value['x402_access']['protected_path'] is None"
