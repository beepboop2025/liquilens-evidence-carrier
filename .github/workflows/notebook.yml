name: Research notebook

on:
  pull_request:
    paths:
      - notebooks/**
      - binder/**
      - .github/workflows/notebook.yml
  push:
    branches: [main]
    paths:
      - notebooks/**
      - binder/**
      - .github/workflows/notebook.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebook:
    name: execute-notebook
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Execute twice in isolated environments
        run: python notebooks/tests/validate_notebook.py
