name: Verify LiquiLens Evidence Carrier
description: Fail closed when a financial evidence carrier loses identity, provenance, rights, or temporal integrity.
author: LiquiLens

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Path to one Evidence Carrier JSON file.
    required: true
  as_of:
    description: Optional UTC policy evaluation time ending in Z. Defaults to the runner clock.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    - name: Verify evidence carrier
      shell: bash
      env:
        LIQUILENS_EVIDENCE_PATH: ${{ inputs.path }}
        LIQUILENS_EVIDENCE_AS_OF: ${{ inputs.as_of }}
      run: |
        liquilens_args=("$LIQUILENS_EVIDENCE_PATH")
        if [[ -n "$LIQUILENS_EVIDENCE_AS_OF" ]]; then
          liquilens_args+=(--as-of "$LIQUILENS_EVIDENCE_AS_OF")
        fi
        python "$GITHUB_ACTION_PATH/scripts/action_verify.py" "${liquilens_args[@]}"
