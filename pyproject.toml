[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liquilens-evidence"
version = "0.15.0"
description = "Portable, fail-closed financial evidence provenance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "LiquiLens"}]
keywords = [
    "financial-evidence",
    "fdc3",
    "lineage",
    "provenance",
    "openlineage",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://liquilens.in/protocol/"
Documentation = "https://github.com/beepboop2025/liquilens-evidence-carrier#readme"
Repository = "https://github.com/beepboop2025/liquilens-evidence-carrier"
Issues = "https://github.com/beepboop2025/liquilens-evidence-carrier/issues"

[project.scripts]
liquilens-evidence = "liquilens_evidence.evidence_cli:main"
liquilens-evidence-mcp = "liquilens_evidence.mcp_server:main"

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "jsonschema>=4.23,<5",
    "mypy>=1.17,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liquilens_evidence = ["py.typed"]

[tool.setuptools.data-files]
"share/liquilens_evidence/protocol" = ["protocol/*.schema.json", "protocol/*.json", "protocol/*.mjs"]
"share/liquilens_evidence/docs" = ["docs/*.md"]
"share/liquilens_evidence/integrations" = ["integrations/README.md"]
"share/liquilens_evidence/integrations/dbt" = ["integrations/dbt/README.md", "integrations/dbt/dbt_project.yml"]
"share/liquilens_evidence/integrations/dbt/macros" = ["integrations/dbt/macros/*.sql"]
"share/liquilens_evidence/integrations/fdc3" = ["integrations/fdc3/*.json"]
"share/liquilens_evidence/integrations/openlineage" = ["integrations/openlineage/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 88
